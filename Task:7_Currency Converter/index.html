
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter | SpireX Foundation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <div class="logo">FX</div>
            <h1>Currency Converter</h1>
            <p>Convert your money with the latest available exchange rates.</p>
        </header>

        <main class="converter-card">

            <div class="input-group">
                <label for="amount">Enter Amount</label>
                <input type="number" id="amount" placeholder="Enter amount"
                    value="100" min="0" step="any">
            </div>

            <div class="currency-section">

                <div class="currency-box">
                    <label for="fromCurrency">From</label>
                    <select id="fromCurrency">
                        <option value="USD">USD - US Dollar</option>
                        <option value="PKR">PKR - Pakistani Rupee</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                    </select>
                </div>

                <button id="swapBtn" class="swap-btn" title="Swap currencies">
                    ⇄
                </button>

                <div class="currency-box">
                    <label for="toCurrency">To</label>
                    <select id="toCurrency">
                        <option value="PKR">PKR - Pakistani Rupee</option>
                        <option value="USD">USD - US Dollar</option>
                        <option value="EUR">EUR - Euro</option>
                        <option value="GBP">GBP - British Pound</option>
                        <option value="INR">INR - Indian Rupee</option>
                        <option value="AED">AED - UAE Dirham</option>
                        <option value="SAR">SAR - Saudi Riyal</option>
                        <option value="CAD">CAD - Canadian Dollar</option>
                        <option value="AUD">AUD - Australian Dollar</option>
                        <option value="JPY">JPY - Japanese Yen</option>
                        <option value="CNY">CNY - Chinese Yuan</option>
                        <option value="CHF">CHF - Swiss Franc</option>
                    </select>
                </div>

            </div>

            <button id="convertBtn" class="convert-btn">
                Convert Currency
            </button>

            <div class="result-box">
                <p class="result-label">Converted Amount</p>
                <h2 id="result">0.00 PKR</h2>
                <p id="rateInfo">Exchange rate will appear here.</p>
            </div>

            <p id="status" class="status" aria-live="polite"></p>

        </main>

        <footer>
            <p>Powered by Frankfurter Exchange Rate API</p>
            <p>Currency Converter | SpireX Foundation Task 7</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
