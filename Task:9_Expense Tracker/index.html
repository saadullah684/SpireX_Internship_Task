
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <p>Manage your daily expenses easily</p>
        </header>

        <div class="total-box">
            <h3>Total Expenses</h3>
            <h2 id="total">Rs. 0</h2>
        </div>

        <div class="form-box">
            <h2>Add New Expense</h2>

            <form id="expenseForm">
                <input type="text" id="expenseName"
                    placeholder="Expense Name" required>

                <input type="number" id="expenseAmount"
                    placeholder="Amount (Rs.)" min="0.01" step="0.01" required>

                <button type="submit">Add Expense</button>
            </form>
        </div>

        <div class="expenses-box">
            <h2>Expense History</h2>

            <ul id="expenseList">
                <li class="empty">No expenses added yet.</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
